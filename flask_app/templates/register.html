{% extends "base.html" %}

{% block title %}Create Account — Personal Finance Advisor Bot{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-6 bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
  <div class="text-center mb-6">
    <div class="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-xl mx-auto mb-3">
      <i class="fa-solid fa-user-plus"></i>
    </div>
    <h2 class="text-2xl font-bold text-slate-800">Create Your Profile</h2>
    <p class="text-xs text-slate-500 mt-1">Start tracking your income, budget, and goals with AI</p>
  </div>

  <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
      <input type="text" name="username" required class="w-full px-3.5 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="e.g. shriram_k">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
      <input type="email" name="email" required class="w-full px-3.5 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="name@example.com">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
      <input type="password" name="password" required class="w-full px-3.5 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Create a secure password">
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Currency</label>
        <select name="currency" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white outline-none">
          <option value="$">$ (USD)</option>
          <option value="₹">₹ (INR)</option>
          <option value="€">€ (EUR)</option>
          <option value="£">£ (GBP)</option>
          <option value="C$">C$ (CAD)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Financial Persona</label>
        <select name="persona" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white outline-none">
          <option value="Salaried Professional">Salaried Pro</option>
          <option value="College Student">College Student</option>
          <option value="Freelancer / Consultant">Freelancer</option>
        </select>
      </div>
    </div>

    <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm rounded-lg shadow-xs transition-colors cursor-pointer mt-2">
      Create Account & Initialize Envelopes
    </button>
  </form>

  <div class="text-center text-xs text-slate-500 mt-6 border-t border-slate-100 pt-4">
    Already have an account? 
    <a href="{{ url_for('login') }}" class="text-emerald-700 font-semibold hover:underline">Sign in here</a>
  </div>
</div>
{% endblock %}
