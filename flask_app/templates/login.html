{% extends "base.html" %}

{% block title %}Sign In — Personal Finance Advisor Bot{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-10 bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
  <div class="text-center mb-6">
    <div class="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-xl mx-auto mb-3">
      <i class="fa-solid fa-lock"></i>
    </div>
    <h2 class="text-2xl font-bold text-slate-800">Welcome Back</h2>
    <p class="text-xs text-slate-500 mt-1">Sign in to access your personal finance dashboard</p>
  </div>

  <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">Username or Email</label>
      <input type="text" name="username" required class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="e.g. alex_bennett">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
      <input type="password" name="password" required class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none" placeholder="••••••••">
    </div>

    <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm rounded-lg shadow-xs transition-colors cursor-pointer">
      Sign In
    </button>
  </form>

  <div class="text-center text-xs text-slate-500 mt-6 border-t border-slate-100 pt-4">
    Don't have an account? 
    <a href="{{ url_for('register') }}" class="text-emerald-700 font-semibold hover:underline">Register now</a>
  </div>
</div>
{% endblock %}
